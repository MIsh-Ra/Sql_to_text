[project]
name = "text-to-sql-agent"
version = "0.1.0"
description = "A portfolio-grade Text-to-SQL agent with schema retrieval, few-shot augmentation, and LangGraph self-correction."
readme = "README.md"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
